<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<title>Coin Drift - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body data-mode="login">

<!-- The 3D world (three.js). Everything else floats on top of it. -->
<canvas id="scene" aria-hidden="true"></canvas>
<div class="haze" aria-hidden="true"></div>

<main class="stage">
  <!-- Left: brand + pitch. Decorative, the 3D scene lives behind it. -->
  <section class="hero" aria-hidden="true">
    <div class="brand"><i class="cube-mark"></i><span>Coin Drift</span></div>
    <div class="pitch">
      <p class="eyebrow"><i class="coin-dot"></i> Free to play &middot; syncs to your dashboard</p>
      <h2>Drift.<br>Collect.<br><span>Don&rsquo;t fall.</span></h2>
      <ul class="chips">
        <li>3 levels</li>
        <li>Daily quests</li>
        <li>Live leaderboard</li>
      </ul>
    </div>
  </section>

  <!-- Right: the form. No box, it grows out of the scene. -->
  <section class="panel" id="panel">
    <div class="panel-in">
      <nav class="tabs" aria-label="Account">
        <a id="tab-login" href="/login">Log in</a>
        <a id="tab-signup" href="/signup">Sign up</a>
        <i class="thumb" aria-hidden="true"></i>
      </nav>

      <h1 id="title">Welcome back</h1>
      <p class="sub" id="sub">Sign in to play Coin Drift.</p>

      <form id="form" novalidate autocomplete="on">
        <div class="field" data-for="signup">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <input id="username" placeholder=" " maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
          <label for="username">Username</label>
        </div>

        <div class="field" data-for="signup">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>
          <input id="email" type="email" placeholder=" " maxlength="254" autocomplete="email" autocapitalize="none" spellcheck="false">
          <label for="email">Email</label>
        </div>

        <div class="field" data-for="login">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <input id="identifier" placeholder=" " maxlength="254" autocomplete="username" autocapitalize="none" spellcheck="false">
          <label for="identifier">Username or email</label>
        </div>

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" placeholder=" " maxlength="72" autocomplete="current-password">
          <label for="password">Password</label>
          <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
          </button>
        </div>

        <div class="field" id="f2fa" hidden>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
          <input id="code" placeholder=" " maxlength="20" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false">
          <label for="code">6-digit code or recovery code</label>
        </div>

        <div class="meter" id="meter" data-for="signup" aria-hidden="true">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span class="mtxt" id="mtxt">8+ chars, a letter and a number</span>
        </div>

        <div class="err" id="err" role="alert" aria-live="polite"></div>

        <button class="go" id="go" type="submit">
          <span class="face"><span class="lbl" id="golbl">Log in</span><span class="spin" aria-hidden="true"></span></span>
        </button>
      </form>

      <p class="alt" id="back2fa" hidden><a href="/login" id="backlink">Use a different account</a></p>
      <p class="alt" id="altrow"><span id="alt">New here?</span> <a id="altlink" href="/signup">Create an account</a></p>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/auth3d.js"></script>
<script src="/auth.js"></script>
</body>
</html>
