<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a22">
<title>Coin Drift - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<canvas id="bg3d" aria-hidden="true"></canvas>
<div class="floor" aria-hidden="true"></div>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <main>
    <header class="bar">
      <div class="ttl"><h1 id="title">Dashboard</h1><p id="sub"></p></div>
      <div class="acts">
        <button class="kbtn" id="cmdbtn" type="button" aria-label="Open command palette"><span class="kic" id="kic"></span>Search <kbd>Ctrl K</kbd></button>
        <a class="play" href="/game" id="playtop">Play now</a>
      </div>
    </header>
    <section id="view" tabindex="-1"></section>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
<dialog id="cmd" aria-label="Command palette"><input id="cmdq" placeholder="Type a command or page..." autocomplete="off" aria-label="Command"><div id="cmdlist"></div></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/dash3d.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
