services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PEPPER: ${PEPPER:?Set PEPPER in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true when served over HTTPS
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-1440}   # sign out after this many idle minutes
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      DB_PATH: /data/data.db
    volumes: [appdata:/data]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    read_only: true            # container filesystem is read-only except /data and /tmp
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 10
    # no "ports": Redis is only reachable by the app on the private compose network
    restart: unless-stopped
volumes: { appdata: {}, redisdata: {} }
